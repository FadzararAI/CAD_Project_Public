[dram_structure]
; Note: Using DDR4 protocol as DRAMSim3 doesn't support DDR5 natively
; DDR5 timings are preserved for accurate performance modeling
protocol = DDR4
bankgroups = 8
banks_per_group = 4
rows = 65536
columns = 256
device_width = 8
; BL=8 to match gem5 cache line size (8 * 8 bytes = 64 bytes)
BL = 8

[timing]
tCK = 0.312
AL = 0
CL = 52
CWL = 36
tRCD = 50
tRP = 50
tRAS = 96
tRFC = 640
tRFC2 = 480
tRFC4 = 300
tREFI = 25000
tRPRE = 1
tWPRE = 1
tRRD_S = 5
tRRD_L = 10
tWTR_S = 10
tWTR_L = 16
tFAW = 36
tWR = 56
tWR2 = 56
tRTP = 16
tCCD_S = 4
tCCD_L = 10
tCKE = 12
tCKESR = 13
tXS = 660
tXP = 22
tRTRS = 1

[power]
VDD = 1.1
IDD0 = 130
IPP0 = 18.0
IDD2P = 14
IDD2N = 78
IDD3P = 20
IDD3N = 108
IDD4W = 276
IDD4R = 286
IDD5AB = 360
IDD6x = 26

[system]
channel_size = 16384
channels = 1
bus_width = 64
address_mapping = rochrababgco
queue_structure = PER_BANK
refresh_policy = RANK_LEVEL_STAGGERED
row_buf_policy = OPEN_PAGE
cmd_queue_size = 64
trans_queue_size = 64

[other]
epoch_period = 3205128
output_level = 1
