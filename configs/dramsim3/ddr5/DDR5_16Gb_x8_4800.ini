[dram_structure]
; Note: Using DDR4 protocol as DRAMSim3 doesn't support DDR5 natively
; DDR5 timings are preserved for accurate performance modeling
protocol = DDR4
bankgroups = 8
banks_per_group = 4
rows = 65536
columns = 256
device_width = 8
; BL=8 to match gem5 cache line size (8 * 8 bytes = 64 bytes)
BL = 8

