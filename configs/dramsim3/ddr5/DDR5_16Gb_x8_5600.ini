[dram_structure]
; Note: Using DDR4 protocol as DRAMSim3 doesn't support DDR5 natively
; DDR5 timings are preserved for accurate performance modeling
protocol = DDR4
bankgroups = 8
banks_per_group = 4
rows = 65536
columns = 256
device_width = 8
; BL=8 to match gem5 cache line size (8 * 8 bytes = 64 bytes)
BL = 8

[timing]
tCK = 0.357
AL = 0
CL = 46
CWL = 34
tRCD = 45
tRP = 45
tRAS = 88
tRFC = 600
tRFC2 = 450
tRFC4 = 280
tREFI = 21840
tRPRE = 1
tWPRE = 1
tRRD_S = 5
tRRD_L = 9
tWTR_S = 9
tWTR_L = 14
tFAW = 34
tWR = 52
tWR2 = 52
tRTP = 14
tCCD_S = 4
tCCD_L = 8
tCKE = 12
tCKESR = 13
tXS = 640
tXP = 20
tRTRS = 1

[power]
VDD = 1.1
IDD0 = 124
IPP0 = 18.0
IDD2P = 13
IDD2N = 74
IDD3P = 19
IDD3N = 102
IDD4W = 262
IDD4R = 272
IDD5AB = 344
IDD6x = 25

[system]
channel_size = 16384
channels = 1
bus_width = 64
address_mapping = rochrababgco
queue_structure = PER_BANK
refresh_policy = RANK_LEVEL_STAGGERED
row_buf_policy = OPEN_PAGE
cmd_queue_size = 64
trans_queue_size = 64

[other]
epoch_period = 2801120
output_level = 1
